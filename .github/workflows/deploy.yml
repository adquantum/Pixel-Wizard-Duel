name: Deploy Vite to GitHub Pages

on:
  push:
    branches: ["main"]  # 如果你的主分支不是 main，请改成你自己的分支名
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"  # 或你项目里用的 node 版本

      - name: Install dependencies
        run: npm install  # 或者 yarn install / pnpm install

      - name: Build project
        run: npm run build  # 确保你的 package.json 有这个 build 脚本

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
